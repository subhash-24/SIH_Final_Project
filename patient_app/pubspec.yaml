name: patient_app
description: "Arogya-Saathi Patient Intake App — Speak Naturally. Get Structured. Care Smarter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  go_router: ^14.0.0
  shared_preferences: ^2.3.0
  record: ^5.1.0
  permission_handler: ^11.3.0
  image_picker: ^1.1.0
  flutter_svg: ^2.0.10
  intl: ^0.20.2
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
